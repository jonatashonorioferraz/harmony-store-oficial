name: Preflight da recuperação isolada (SQL pendente)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harmony-isolated-recovery
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: recovery
    env:
      SUPABASE_URL: https://tyzfznwvjzmudxtcbbaf.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_BACKUP_SECRET_KEY }}
      RECOVERY_SUPABASE_URL: ${{ secrets.RECOVERY_SUPABASE_URL }}
      RECOVERY_PROJECT_REF: ${{ vars.RECOVERY_PROJECT_REF }}
      RECOVERY_CONFIRM: RESTORE_ISOLATED_HARMONY
      BACKUP_DIR: backups/current
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Intentionally fails before reading production: the former REST importer
      # cannot preserve triggers, identities and sequences. See the runbook.
      - name: Bloquear ensaio até aprovar restauração SQL em destino dedicado
        run: node scripts/execute-api-recovery.mjs --preflight-config
      - name: Criar backup atual da produção
        run: node scripts/create-api-backup.mjs
      - name: Validar integridade do backup
        run: node scripts/verify-api-backup.mjs "$BACKUP_DIR" --require-current
      - name: Exibir bloqueios da restauração isolada
        run: node scripts/execute-api-recovery.mjs "$BACKUP_DIR"
